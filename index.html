<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slider-container">
        <div class="slider">
            <div class="slides">
                <!-- Slide 1 -->
                <div class="slide active" style="background: linear-gradient(135deg, #ff7b00, #ffae00); display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; font-weight: bold;">
                    <span>Slide 1: Orange</span>
                </div>
                <!-- Slide 2 -->
                <div class="slide" style="background: linear-gradient(135deg, #00b4db, #0083b0); display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; font-weight: bold;">
                    <span>Slide 2: Blue</span>
                </div>
                <!-- Slide 3 -->
                <div class="slide" style="background: linear-gradient(135deg, #11998e, #38ef7d); display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; font-weight: bold;">
                    <span>Slide 3: Green</span>
                </div>
                <!-- Slide 4 -->
                <div class="slide" style="background: linear-gradient(135deg, #8e2de2, #4a00e0); display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; font-weight: bold;">
                    <span>Slide 4: Purple</span>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <button class="prev-btn" id="prevBtn">&#10094;</button>
            <button class="next-btn" id="nextBtn">&#10095;</button>

            <!-- Indicators (Dots) -->
            <div class="dots-container" id="dotsContainer"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
